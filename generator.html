<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan - Sando & Rosiana</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background-color: #f4e6ec;
            background-image: url("./bg-polos.jpg");
            background-size: cover;
            background-position: center;
            color: #79513f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-generator {
            background: rgba(255, 250, 245, 0.9);
            border: 1px solid rgba(179, 138, 66, 0.4);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(113, 62, 78, 0.15);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .judul-mempelai {
            font-family: 'Alex Brush', cursive;
            font-size: 38px;
            color: #4A231D;
            margin-bottom: 5px;
            line-height: 1;
        }

        .subjudul-admin {
            font-size: 11px;
            letter-spacing: 2px;
            color: #b38a42;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #4A231D;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(179, 138, 66, 0.5);
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 13px;
            color: #4A231D;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #713e4e;
        }

        .btn-generate {
            width: 100%;
            background-color: #713e4e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-family: Georgia, serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(113, 62, 78, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-generate:hover {
            background-color: #59313e;
            transform: translateY(-2px);
        }

        /* BOX HASIL LINK */
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px dashed #b38a42;
            border-radius: 12px;
            text-align: left;
        }

        .url-text {
            font-size: 12px;
            color: #713e4e;
            word-break: break-all;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin: 8px 0 12px 0;
            user-select: all;
        }

        .btn-action-group {
            display: flex;
            gap: 8px;
        }

        .btn-copy, .btn-wa {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            font-family: Georgia, serif;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: opacity 0.2s ease;
        }

        .btn-copy {
            background-color: #b38a42;
            color: white;
        }

        .btn-wa {
            background-color: #25D366;
            color: white;
            text-decoration: none;
        }

        .btn-copy:hover, .btn-wa:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card-generator">
        <h1 class="judul-mempelai">Sando & Rosiana</h1>
        <div class="subjudul-admin">Generator Link Undangan Tamu</div>

        <div class="form-group">
            <label for="inputNama">Nama Tamu Undangan:</label>
            <input type="text" id="inputNama" placeholder="Contoh: Bapak Ahmad & Keluarga">
        </div>

        <button class="btn-generate" onclick="generateLink()">Buat Link Undangan</button>

        <!-- HASIL GENERATE -->
        <div id="resultBox" class="result-box">
            <label>Link Khusus Tamu:</label>
            <div id="urlResult" class="url-text"></div>
            
            <div class="btn-action-group">
                <button class="btn-copy" onclick="salinLink()">📋 Salin Link</button>
                <a id="btnWa" class="btn-wa" href="#" target="_blank">💬 Kirim WA</a>
            </div>
        </div>
    </div>

    <script>
        function generateLink() {
            var nama = document.getElementById("inputNama").value.trim();
            if (!nama) {
                alert("Masukkan nama tamu undangan terlebih dahulu!");
                return;
            }

            // Mendapatkan URL dasar index.html
            var baseUrl = window.location.href.replace("generator.html", "index.html");
            
            // Format URL dengan parameter ?to=
            var finalUrl = baseUrl.split('?')[0] + "?to=" + encodeURIComponent(nama);

            // Tampilkan Link
            document.getElementById("urlResult").innerText = finalUrl;
            document.getElementById("resultBox").style.display = "block";

            // Siapkan Draf Pesan WhatsApp
            var pesanWA = "Assalamu'alaikum Warahmatullahi Wabarakatuh.\n\n" +
                "Kepada Yth. * " + nama + " *\n\n" +
                "Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:\n\n" +
                " *Sando & Rosiana*\n\n" +
                "Berikut link undangan digital kami untuk informasi lengkap acara:\n" +
                finalUrl + "\n\n" +
                "Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.\n\n" +
                "Wassalamu'alaikum Warahmatullahi Wabarakatuh.";

            document.getElementById("btnWa").href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(pesanWA);
        }

        function salinLink() {
            var text = document.getElementById("urlResult").innerText;
            navigator.clipboard.writeText(text).then(function() {
                alert("Link berhasil disalin ke clipboard!");
            });
        }
    </script>
</body>
</html>
